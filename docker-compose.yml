version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: disaster_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: disaster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/disaster_db?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-12345"
      FRONTEND_URL: "http://localhost:5173"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "AdminPassword123!"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
